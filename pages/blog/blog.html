<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0000" />

    <title>Blog</title>
    <link type="text/css" rel="stylesheet" href="../../index.css" />
    <link type="text/css" rel="stylesheet" href="./blog.css" />

    <script type="module" src="../../components/footer/cdc-footer.js"></script>
    <script src="./posts.js" defer></script>
    <script src="./blog.js" defer></script>

    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="//metrics.myglobal.ws/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '3']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <header class="header-pages">
      <h2>Blog</h2>
      <nav class="sub-nav">
        <a href="../../index.html"
          ><img id="home" src="../../images/icons/home.svg" alt="home"
        /></a>
      </nav>
    </header>

    <main>
      <ul id="blog-list" class="blog-list"></ul>
    </main>

    <footer>
      <cdc-footer></cdc-footer>
    </footer>
  </body>
</html>
